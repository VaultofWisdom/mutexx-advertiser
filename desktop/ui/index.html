<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutexx Advertiser</title>
<style>
  :root{--bg:#0a0a0f;--text:#f4f4f7;--muted:#a1a1ab;--grad:linear-gradient(90deg,#9810fa,#4f39f6)}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.6 -apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif}
  body{display:grid;place-items:center;overflow:hidden}
  body::before{content:"";position:fixed;inset:-30% -20% auto auto;width:900px;height:700px;
    background:radial-gradient(closest-side,rgba(152,16,250,.14),transparent 70%)}
  .box{position:relative;text-align:center;max-width:520px;padding:24px}
  .logo{width:72px;height:72px;border-radius:22px;background:var(--grad);display:grid;place-items:center;
    margin:0 auto 22px;box-shadow:0 18px 50px -14px rgba(124,57,246,.9)}
  .logo svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:24px;letter-spacing:-.02em}
  p{color:var(--muted);margin:8px 0 0}
  .bar{width:220px;height:4px;border-radius:9px;background:#1e1e29;overflow:hidden;margin:26px auto 0}
  .bar span{display:block;height:100%;width:40%;background:var(--grad);border-radius:9px;
    animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  .error{display:none;margin-top:22px;padding:14px 16px;border-radius:14px;text-align:left;
    background:rgba(231,0,11,.08);border:1px solid rgba(231,0,11,.35);color:#ffd0d3;font-size:13.5px}
  .error code{display:block;margin-top:8px;color:#ffb3b8;font:12px/1.5 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-all}
  body.failed .bar{display:none}
  body.failed .error{display:block}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 10.5v3a1 1 0 0 0 1 1h3l6 4.5V5L7 9.5H4a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/></svg></div>
    <h1>Mutexx Advertiser</h1>
    <p id="msg">Starting ...</p>
    <div class="bar"><span></span></div>
    <div class="error" id="err"><b id="errTitle">The app could not start.</b><code id="errDetail"></code></div>
  </div>
<script>
  // German first if the system says so - the app itself follows its own setting
  // once it is up; this screen only lives for a second or two.
  if ((navigator.language || '').toLowerCase().startsWith('de')){
    document.documentElement.lang = 'de';
    document.getElementById('msg').textContent = 'Wird gestartet ...';
    document.getElementById('errTitle').textContent = 'Die App konnte nicht starten.';
  }
  // Called from Rust when the server does not come up.
  window.showStartError = (detail) => {
    document.getElementById('errDetail').textContent = detail;
    document.body.classList.add('failed');
  };
</script>
</body>
</html>
