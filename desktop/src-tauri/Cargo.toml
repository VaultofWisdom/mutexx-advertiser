[package]
name = "mutexx-advertiser"
version = "0.6.1"
description = "Mutexx Advertiser - desktop shell"
authors = ["Mutexx Production"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mutexx_advertiser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"
url = "2"

[profile.release]
# The shell is small; the weight is the Python runtime next to it.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation"] }
