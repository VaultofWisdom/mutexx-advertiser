# Release: the Windows installer, its update signature, latest.json for the updater
# and checksums - attached to a DRAFT release in this repository.
#
# Triggered by a tag v*. The draft stays a draft: what goes out and when is decided
# by a human pressing "Publish", not by a tag push. Until then the updater does not
# see it - releases/latest/download/... only knows published releases.
#
# The version has to rise in four places, which do not derive from each other:
#   advertiser/__init__.py, desktop/package.json,
#   desktop/src-tauri/tauri.conf.json, desktop/src-tauri/Cargo.toml
#
# Update-signed, not code-signed. The update signature checks every package against
# the public key built into tauri.conf.json before anything is installed; it is the
# same key as Mutexx Notes and Mutexx VocalRemover. Code signing would only buy the
# absence of the SmartScreen warning.
#
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY (the content of the key
# file) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (may be empty - but must exist, see
# below).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Signing key present?
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set - an unsigned build could never be installed as an update."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        working-directory: .
        run: python -m unittest discover -s tests

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri CLI
        run: npm ci || npm install

      # Python's embeddable distribution (checked against a pinned SHA-256) and a
      # copy of the app, into src-tauri/resources.
      - name: Runtime
        run: python scripts/prepare_runtime.py

      - name: Build, sign, attach to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Keep this line even when the key has no password. Unset is not the same
          # as empty: unset makes the build ask for the password on stdin and wait
          # there forever (Mutexx Notes, 07.09.2026: 58 minutes, no output).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-test', github.run_number) }}
          releaseName: Mutexx Advertiser ${{ github.ref_type == 'tag' && github.ref_name || 'test build' }}
          releaseBody: |
            Windows installer for Mutexx Advertiser. Installs to
            `C:\Program Files\Mutexx Production\Mutexx Advertiser`; data stays in
            `%LOCALAPPDATA%\Mutexx Production\Mutexx Advertiser`.

            Windows SmartScreen warns on first start because the installer is not
            code-signed. Checksums are attached as `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  checksums:
    name: Checksums
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh release download "${{ github.ref_name }}" --dir release --pattern '*' --clobber
          rm -f release/SHA256SUMS.txt
      - name: SHA-256 per file
        run: |
          cd release
          sha256sum $(ls | sort) > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
