<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutexx Advertiser</title>
<style>
  /* ---------------------------------------------------------------------
     Mutexx Production house style, measured off mutexxproduction.de:
     near-black ground with a blue cast, white type, and an indigo-to-violet
     gradient used for headings and primary actions. The traffic-light colours
     come from the same palette, so nothing clashes.
     --------------------------------------------------------------------- */
  :root{
    --bg:#0a0a0f; --panel:#121218; --panel-2:#17171f; --line:#262630;
    --text:#ffffff; --muted:#a1a1ab; --muted-2:#8b8b96;
    --indigo:#4f39f6; --indigo-soft:#7c86ff; --violet:#9810fa; --violet-soft:#c27aff;
    --grad:linear-gradient(90deg,#9810fa 0%,#4f39f6 100%);
    --grad-head:linear-gradient(90deg,#7c86ff 0%,#c27aff 50%,#615fff 100%);
    --green:#00bc7d; --yellow:#fe9a00; --red:#e7000b; --grey:#6b6b78;
    --r-s:10px; --r-m:14px; --r-l:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
      "Noto Sans",Arial,sans-serif}
  a{color:var(--indigo-soft);text-decoration:none}
  a:hover{color:var(--violet-soft)}

  header{padding:16px 26px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12121a,#0a0a0f);display:flex;
    align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .brand{display:flex;flex-direction:column;gap:2px}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;
    background:var(--grad-head);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent}
  .brand small{font-size:11.5px;color:var(--muted-2);letter-spacing:.01em}

  nav{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;position:sticky;top:69px;z-index:19}
  nav button{background:none;border:none;color:var(--muted);padding:13px 14px;
    cursor:pointer;font:inherit;font-size:14px;border-bottom:2px solid transparent;
    transition:color .15s}
  nav button:hover{color:var(--text)}
  nav button.active{color:var(--text);border-image:var(--grad) 1;border-bottom-width:2px;
    border-bottom-style:solid}

  main{padding:24px 26px 80px;max-width:1500px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

  button.btn{background:var(--grad);color:#fff;border:none;padding:9px 18px;
    border-radius:999px;cursor:pointer;font:inherit;font-size:14px;font-weight:500;
    transition:opacity .15s}
  button.btn:hover{opacity:.88}
  button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.btn.ghost:hover{border-color:var(--indigo-soft);opacity:1}
  button.btn:disabled{opacity:.4;cursor:not-allowed}

  input,select,textarea{background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;font:inherit;
    font-size:14px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--indigo)}
  input::placeholder,textarea::placeholder{color:var(--muted-2)}
  textarea{width:100%;min-height:230px;font-family:ui-monospace,Consolas,monospace;
    font-size:13px;line-height:1.55}
  label.check{color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;
    gap:6px;cursor:pointer}

  .bar{height:5px;background:var(--panel-2);border-radius:999px;overflow:hidden;flex:1;
    min-width:220px}
  .bar span{display:block;height:100%;background:var(--grad);transition:width .3s}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th{text-align:left;color:var(--muted-2);font-weight:500;padding:8px 10px;
    border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase}
  td{padding:10px;border-bottom:1px solid #1b1b23;vertical-align:top}
  tr.sel td{background:#16161f}
  tbody tr:hover td{background:#15151d;cursor:pointer}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;
    white-space:nowrap;font-weight:500}
  .gruen{background:rgba(0,188,125,.13);color:#5ce0b0;border:1px solid rgba(0,188,125,.4)}
  .gelb{background:rgba(254,154,0,.13);color:#ffc46b;border:1px solid rgba(254,154,0,.4)}
  .rot{background:rgba(231,0,11,.13);color:#ff8b92;border:1px solid rgba(231,0,11,.4)}
  .grau{background:rgba(107,107,120,.15);color:#a9a9b5;border:1px solid var(--line)}
  .lila{background:rgba(152,16,250,.13);color:var(--violet-soft);
    border:1px solid rgba(152,16,250,.4)}

  .score{font-variant-numeric:tabular-nums;font-weight:600;
    background:var(--grad-head);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
    padding:20px 22px;margin-top:16px}
  .panel h3{margin:0 0 10px;font-size:15.5px;font-weight:600;letter-spacing:-.005em}
  .muted{color:var(--muted);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}

  ul.checklist{margin:8px 0 0;padding-left:20px}
  ul.checklist li{margin-bottom:6px}

  .evidence{border-left:2px solid var(--violet);padding:7px 0 7px 13px;margin:9px 0;
    font-size:13.5px;color:var(--muted);border-radius:0 var(--r-s) var(--r-s) 0}
  .evidence b{color:var(--violet-soft);font-weight:500}

  .kv{display:grid;grid-template-columns:190px 1fr;gap:9px 14px;font-size:14px;
    align-items:center}
  .kv>div:nth-child(odd){color:var(--muted)}

  .warn{background:rgba(231,0,11,.09);border:1px solid rgba(231,0,11,.35);
    padding:12px 15px;border-radius:var(--r-m);margin:12px 0;font-size:14px}
  .ok{background:rgba(0,188,125,.09);border:1px solid rgba(0,188,125,.35);
    padding:11px 15px;border-radius:var(--r-m);margin:10px 0;font-size:14px}
  .tag{display:inline-block;background:var(--panel-2);border:1px solid var(--line);
    padding:3px 10px;border-radius:999px;font-size:12.5px;margin:3px 5px 3px 0;
    color:var(--muted)}
  a.tag:hover{border-color:var(--indigo-soft);color:var(--text)}

  /* Manual */
  .doc{max-width:940px;line-height:1.75}
  .doc h2{font-size:19px;font-weight:600;margin:36px 0 10px;padding-bottom:8px;
    border-bottom:1px solid var(--line);scroll-margin-top:130px;
    background:var(--grad-head);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
  .doc h2:first-of-type{margin-top:8px}
  .doc p{margin:11px 0}
  .doc ul,.doc ol{margin:11px 0;padding-left:24px}
  .doc li{margin-bottom:7px}
  .doc code{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .doc i{color:var(--violet-soft);font-style:normal}
  .doc table{margin:14px 0}
  .doc td:first-child{white-space:nowrap;color:var(--muted);width:210px}
  .doc tbody tr:hover td{background:none;cursor:auto}
  .toc{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center}
  .toc b{width:100%;color:var(--muted-2);font-weight:500;font-size:11.5px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .toc a{font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Mutexx Advertiser</h1>
    <small data-i18n="app.tagline"></small>
  </div>
  <div class="row" style="margin-left:auto">
    <select id="productSel" style="min-width:200px"></select>
    <button class="btn" id="runAllBtn" data-i18n="run.start"></button>
    <button class="btn ghost" id="scanBtn" data-i18n="action.scan"></button>
    <span class="muted" id="scanMsg"></span>
  </div>
  <div class="bar" id="scanBarWrap" style="display:none"><span id="scanBar" style="width:0"></span></div>
</header>

<nav id="nav"></nav>

<main>
  <!-- ============ PRODUCT ============ -->
  <section id="tab-product">
    <div class="panel">
      <h3 data-i18n="product.title"></h3>
      <p class="muted" data-i18n="product.intro"></p>
      <div class="grid2" style="margin-top:16px">
        <div class="kv">
          <div data-i18n="product.name"></div><div><input id="pName" style="width:100%"></div>
          <div data-i18n="product.url"></div><div><input id="pUrl" style="width:100%" placeholder="https://..."></div>
          <div data-i18n="product.version"></div><div><input id="pVersion" style="width:130px"></div>
          <div data-i18n="product.one_liner"></div><div><input id="pOneLiner" style="width:100%" data-i18n-ph="product.one_liner_hint"></div>
          <div data-i18n="product.category"></div><div><select id="pCategory" style="width:100%"></select></div>
          <div data-i18n="product.price_model"></div><div><select id="pPriceModel" style="width:100%"></select></div>
          <div data-i18n="product.price_point"></div><div><input id="pPricePoint" style="width:170px" placeholder="19.90 EUR"></div>
        </div>
        <div class="kv">
          <div data-i18n="product.audience"></div><div><input id="pAudience" style="width:100%" data-i18n-ph="product.audience_hint"></div>
          <div data-i18n="product.regions"></div><div><input id="pRegions" style="width:100%" placeholder="DE, AT, CH"></div>
          <div data-i18n="product.languages"></div><div><input id="pLanguages" style="width:100%" placeholder="en, de"></div>
          <div data-i18n="product.budget"></div><div><input id="pBudget" type="number" style="width:150px"> <span class="muted">EUR</span></div>
          <div data-i18n="product.tone"></div><div><select id="pTone" style="width:100%"></select></div>
          <div data-i18n="product.repo"></div><div><input id="pRepo" style="width:100%" placeholder="https://github.com/..."></div>
          <div data-i18n="product.download"></div><div><input id="pDownload" style="width:100%"></div>
        </div>
      </div>
      <div class="kv" style="margin-top:16px">
        <div data-i18n="product.description"></div>
        <div><textarea id="pDescription" style="min-height:120px" data-i18n-ph="product.description_hint"></textarea></div>
        <div data-i18n="product.keywords"></div>
        <div><textarea id="pKeywords" style="min-height:72px" data-i18n-ph="product.keywords_hint"></textarea></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="pSave" data-i18n="product.save"></button>
        <button class="btn ghost" id="pNew" data-i18n="product.new"></button>
        <button class="btn ghost" id="pDelete" data-i18n="product.delete"></button>
        <span class="muted" id="pMsg"></span>
      </div>
    </div>
  </section>

  <!-- ============ ANALYSIS ============ -->
  <section id="tab-analysis" hidden>
    <div class="row">
      <button class="btn" id="anaBtn" data-i18n="analysis.run"></button>
      <label class="check"><input type="checkbox" id="anaApi"> <span data-i18n="analysis.use_api"></span></label>
      <span class="muted" id="anaMsg"></span>
    </div>
    <p class="muted" style="margin-top:12px" data-i18n="analysis.intro"></p>
    <div id="anaBox"></div>
  </section>

  <!-- ============ STRATEGY ============ -->
  <section id="tab-strategy" hidden>
    <div class="row">
      <button class="btn" id="strBtn" data-i18n="strategy.build"></button>
      <label class="check"><input type="checkbox" id="strApi"> <span data-i18n="strategy.use_api"></span></label>
      <span class="muted" id="strMsg"></span>
    </div>
    <div class="warn" style="margin-top:14px">
      <b data-i18n="strategy.no_money"></b> <span data-i18n="strategy.no_money_body"></span>
    </div>
    <div id="strBox"></div>
  </section>

  <!-- ============ ASSETS ============ -->
  <section id="tab-assets" hidden>
    <div class="row">
      <label class="check"><input type="checkbox" id="assetApi"> <span data-i18n="assets.use_api"></span></label>
      <span class="muted" id="assetMsg"></span>
    </div>
    <p class="muted" style="margin-top:12px" data-i18n-html="assets.intro"></p>
    <p class="muted" data-i18n="assets.intro2"></p>
    <div id="assetBox"></div>
  </section>

  <!-- ============ COMMUNITIES ============ -->
  <section id="tab-run" hidden>
    <div class="panel">
      <h3 data-i18n="run.title"></h3>
      <p class="muted" data-i18n="run.what"></p>
      <p style="margin-top:12px" data-i18n="run.nothing_published"></p>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="runAllBtn2" data-i18n="run.start"></button>
        <label class="check"><input type="checkbox" id="runUseApi">
          <span data-i18n="assets.use_api"></span></label>
        <span class="muted" id="runMsg"></span>
      </div>
    </div>
    <div class="panel" id="runReport" hidden>
      <h3 data-i18n="run.report"></h3>
      <div id="runDone"></div>
      <h3 style="margin-top:18px" data-i18n="run.report_skipped"></h3>
      <div id="runSkipped"></div>
    </div>
  </section>

  <section id="tab-communities" hidden>
    <div class="row">
      <input id="filterText" style="min-width:250px" data-i18n-ph="communities.search">
      <select id="filterPlatform"><option value="" data-i18n="communities.all_platforms"></option>
        <option value="reddit">reddit</option><option value="lemmy">lemmy</option>
        <option value="forum">forum</option><option value="hackernews">Hacker News</option>
        <option value="lobsters">Lobsters</option></select>
      <select id="filterVerdict"><option value=""></option>
        <option value="gruen"></option><option value="gelb"></option>
        <option value="rot"></option><option value="grau"></option></select>
      <button class="btn ghost" id="toggleAdd" data-i18n="communities.add"></button>
      <span class="muted" id="countInfo"></span>
    </div>
    <div class="panel" id="addPanel" hidden>
      <h3 data-i18n="communities.add"></h3>
      <div class="kv">
        <div data-i18n="communities.platform"></div>
        <div><select id="addPlatform"><option value="reddit">reddit</option>
          <option value="lemmy">lemmy</option>
          <option value="forum">forum</option></select></div>
        <div data-i18n="communities.handle"></div><div><input id="addHandle" style="width:100%" placeholder="techsupport"></div>
        <div>URL</div><div><input id="addUrl" style="width:100%" placeholder="https://..."></div>
        <div data-i18n="communities.members"></div><div><input id="addSubs" type="number" style="width:150px"></div>
      </div>
      <div style="margin-top:12px">
        <div class="muted" data-i18n="communities.rules_text"></div>
        <textarea id="addRules" style="min-height:150px"></textarea>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="addCommunity" data-i18n="action.save"></button>
        <span class="muted" id="addMsg"></span>
      </div>
    </div>
    <div class="grid2" style="margin-top:6px">
      <div>
        <table><thead><tr>
          <th>#</th><th data-i18n="communities.handle"></th>
          <th data-i18n="communities.members"></th><th>&#8721;</th><th></th>
        </tr></thead><tbody id="commRows"></tbody></table>
      </div>
      <div id="detail" class="scroll"></div>
    </div>
  </section>

  <!-- ============ SEED LISTS ============ -->
  <section id="tab-seeds" hidden>
    <div class="panel">
      <h3 data-i18n="seeds.title"></h3>
      <p class="muted" data-i18n="seeds.intro"></p>
      <div class="grid2" style="margin-top:14px">
        <div>
          <b data-i18n="seeds.subreddits"></b>
          <div class="muted" data-i18n="seeds.subreddits_hint"></div>
          <textarea id="seedSubs" style="min-height:210px"></textarea>
        </div>
        <div>
          <b data-i18n="seeds.forums"></b>
          <div class="muted" data-i18n="seeds.forums_hint"></div>
          <textarea id="seedForums" style="min-height:210px"></textarea>
        </div>
      </div>
      <div style="margin-top:14px">
        <b data-i18n="seeds.lemmy"></b>
        <div class="muted" data-i18n="seeds.lemmy_hint"></div>
        <textarea id="seedLemmy" style="min-height:110px"></textarea>
        <p class="muted" style="margin-top:8px" data-i18n="seeds.lemmy_note"></p>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="seedSave" data-i18n="seeds.save"></button>
        <button class="btn ghost" id="seedSuggest" data-i18n="seeds.suggest"></button>
        <span class="muted" id="seedMsg"></span>
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="seeds.keywords"></h3>
      <div id="seedKeywords"></div>
      <p class="muted" style="margin-top:10px" data-i18n="seeds.keywords_note"></p>
    </div>
  </section>

  <!-- ============ CAMPAIGN ============ -->
  <section id="tab-campaign" hidden>
    <div class="row">
      <button class="btn" id="prepBtn" data-i18n="campaign.prepare"></button>
      <span class="muted" data-i18n="campaign.limit"></span>
      <input id="prepLimit" type="number" value="25" style="width:90px">
      <label class="check"><input type="checkbox" id="prepGreenOnly"> <span data-i18n="campaign.green_only"></span></label>
      <label class="check"><input type="checkbox" id="prepApi"> <span data-i18n="assets.use_api"></span></label>
      <button class="btn ghost" id="runStart" data-i18n="campaign.start_mode"></button>
      <span class="muted" id="prepMsg"></span>
    </div>
    <div class="panel" id="runPanel" hidden>
      <div class="row"><h3 id="runHead" style="margin:0"></h3>
        <button class="btn ghost" id="runExit" style="margin-left:auto" data-i18n="campaign.exit"></button></div>
      <div class="bar" style="margin:10px 0"><span id="runBar" style="width:0"></span></div>
      <div id="runBody"></div>
    </div>
    <div id="queueList"></div>
  </section>

  <!-- ============ AUTO CHANNELS ============ -->
  <section id="tab-channels" hidden>
    <div class="panel">
      <h3 data-i18n="channels.title"></h3>
      <p class="muted" data-i18n="channels.intro"></p>
      <div class="row" style="margin-top:12px">
        <input id="hookName" data-i18n-ph="channels.webhook_name" style="width:220px">
        <input id="hookUrl" data-i18n-ph="channels.webhook_url" style="flex:1;min-width:320px">
        <button class="btn ghost" id="addHook" data-i18n="channels.add_hook"></button>
      </div>
      <div id="hookList" style="margin-top:12px"></div>
      <h3 style="margin-top:20px" data-i18n="channels.mastodon"></h3>
      <div class="kv">
        <div data-i18n="channels.instance"></div><div><input id="mastoInstance" style="width:100%" placeholder="https://mastodon.social"></div>
        <div data-i18n="channels.token"></div><div><input id="mastoToken" type="password" style="width:100%"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="saveMasto" data-i18n="action.save"></button>
        <button class="btn" id="autoBlast" data-i18n="channels.test_post"></button>
      </div>
      <div id="autoResult"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="channels.discord_search"></h3>
      <div id="discordSearches"></div>
    </div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="tab-history" hidden>
    <div id="historyList"></div>
  </section>

  <!-- ============ MANUAL ============ -->
  <section id="tab-manual" hidden>
    <div class="doc">
      <div class="toc panel" id="manualToc"></div>
      <div id="manualBody"></div>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="tab-settings" hidden>
    <div class="panel">
      <h3 data-i18n="settings.language"></h3>
      <div class="row">
        <select id="langSel" style="min-width:190px"></select>
        <span class="muted" id="langMsg"></span>
      </div>
      <p class="muted" style="margin-top:10px" data-i18n="settings.language_hint"></p>
    </div>
    <div class="panel">
      <h3 data-i18n="settings.reddit"></h3>
      <p class="muted" data-i18n-html="settings.reddit_hint"></p>
      <div class="kv" style="margin-top:12px">
        <div data-i18n="settings.client_id"></div><div><input id="cfgRedditId" style="width:100%"></div>
        <div data-i18n="settings.client_secret"></div><div><input id="cfgRedditSecret" type="password" style="width:100%"></div>
      </div>
      <p class="muted" style="margin-top:14px" data-i18n-html="settings.bot_hint"></p>
      <div class="kv">
        <div data-i18n="settings.bot_user"></div><div><input id="cfgBotUser" style="width:100%"></div>
        <div data-i18n="settings.bot_pass"></div><div><input id="cfgBotPass" type="password" style="width:100%"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="testReddit" data-i18n="settings.test_connection"></button>
        <span class="muted" id="redditMsg"></span>
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="settings.lemmy"></h3>
      <p class="muted" data-i18n="settings.lemmy_note"></p>
      <div class="kv" style="margin-top:12px">
        <div data-i18n="settings.lemmy_instance"></div>
        <div><input id="cfgLemmyInstance" style="width:100%" placeholder="lemmy.world"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="testLemmy" data-i18n="settings.test_connection"></button>
        <span class="muted" id="lemmyMsg"></span>
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="settings.scan_limits"></h3>
      <p class="muted" data-i18n-html="settings.scan_limits_hint"></p>
      <div class="kv" style="margin-top:12px">
        <div data-i18n="settings.max_communities"></div><div><input id="cfgMax" type="number" style="width:130px"></div>
        <div data-i18n="settings.deep_scan"></div><div><input id="cfgDeep" type="number" style="width:130px"></div>
        <div data-i18n="settings.min_members"></div><div><input id="cfgMinSubs" type="number" style="width:130px"></div>
        <div data-i18n="settings.delay"></div><div><input id="cfgDelay" type="number" step="0.1" style="width:130px"></div>
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="settings.safety"></h3>
      <div class="kv">
        <div data-i18n="settings.max_per_day"></div><div><input id="cfgMaxDay" type="number" style="width:130px"></div>
        <div data-i18n="settings.min_days"></div><div><input id="cfgMinDays" type="number" style="width:130px"></div>
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="settings.anthropic"></h3>
      <p class="muted" data-i18n="settings.anthropic_hint"></p>
      <div class="kv" style="margin-top:12px">
        <div data-i18n="settings.api_key"></div><div><input id="cfgApiKey" type="password" style="width:100%" placeholder="sk-ant-..."></div>
        <div data-i18n="settings.model"></div><div><input id="cfgModel" style="width:280px"></div>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="saveCfg" data-i18n="settings.save"></button>
      <span class="muted" id="cfgMsg"></span>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   State and translation
   ===================================================================== */
let STATE = {config:{}, product:{}, products:[], communities:[], queue:[], history:[],
             analysis:{}, strategy:{}, assets:{}, asset_specs:[], seeds:{}, keywords:[],
             discord_searches:[], catalog:{en:{},de:{}}, manual:{en:[],de:[]},
             languages:{}, ui_language:'en', categories:{}, price_models:{}, tones:{},
             angles:{}, verdict_text:{}};
let LANG = 'en';
let SELECTED = null, DRAFT = null, RUN = -1;

const TABS = ['product','run','analysis','strategy','assets','communities','seeds',
              'campaign','channels','history','manual','settings'];
const TAB_KEY = {product:'tab.product', run:'tab.run', analysis:'tab.analysis', strategy:'tab.strategy',
  assets:'tab.assets', communities:'tab.communities', seeds:'tab.seeds',
  campaign:'tab.campaign', channels:'tab.channels', history:'tab.history',
  manual:'tab.manual', settings:'tab.settings'};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* One string out of the catalogue. Missing keys show as the key itself - a gap
   should be conspicuous, not blank. */
function t(key, params){
  const table = (STATE.catalog||{})[LANG] || {};
  let text = table[key];
  if (text === undefined) text = ((STATE.catalog||{}).en || {})[key];
  if (text === undefined) return key;
  if (params) for (const [name, value] of Object.entries(params))
    text = text.split('{'+name+'}').join(String(value));
  return text;
}

/* A stored message - {key, params} - back into a sentence. Parameters may be
   messages themselves, or lists of them. Plain strings pass straight through, so
   anything written before this existed still shows up. */
function tr(entry){
  if (entry === null || entry === undefined) return '';
  if (typeof entry !== 'object') return String(entry);
  if (!('key' in entry)) return String(entry);
  const params = {};
  for (const [name, value] of Object.entries(entry.params || {})){
    if (Array.isArray(value)) params[name] = value.map(tr).join(t('list.separator'));
    else if (value && typeof value === 'object') params[name] = tr(value);
    else params[name] = value;
  }
  return t(entry.key, params);
}
const trAll = (list) => (list||[]).map(tr);

/* Fills everything marked up in the static HTML. Runs on every language change. */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el =>
    el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el =>
    el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el =>
    el.placeholder = t(el.dataset.i18nPh));
  document.documentElement.lang = LANG;

  // Verdict filter options carry their labels from the catalogue.
  const vf = $('filterVerdict');
  if (vf) [...vf.options].forEach(o =>
    o.textContent = o.value ? t('verdict.short.' + o.value) : t('verdict.grau').split(' -')[0]);
}

function renderNav(){
  $('nav').innerHTML = TABS.map(name =>
    `<button data-tab="${name}">${esc(t(TAB_KEY[name]))}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b =>
    b.onclick = () => openTab(b.dataset.tab));
  const current = document.querySelector('nav button.active');
  openTab(current ? current.dataset.tab : (window._tab || 'product'));
}

function openTab(name){
  window._tab = name;
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  TABS.forEach(x => $('tab-' + x).hidden = (x !== name));
  window.scrollTo(0, 0);
}

const api = async (path, body) => {
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                       body:JSON.stringify(body)} : {};
  const res = await fetch(path, opts);
  const data = await res.json();
  if (data && data.error_key) data.error = t(data.error_key);
  return data;
};

/* =====================================================================
   Loading and rendering
   ===================================================================== */
async function refresh(){
  STATE = await api('/api/state');
  LANG = STATE.ui_language || 'en';
  applyStatic();
  renderNav();
  renderLanguage();
  renderProductSwitcher();
  fillProduct();
  fillSettings();
  renderAnalysis();
  renderStrategy();
  renderAssets();
  renderSeeds();
  renderCommunities();
  renderDetail();
  renderQueue();
  renderChannels();
  renderHistory();
  renderManual();
}

/* Redraws everything from the state already in memory - no round trip, so the
   language switch is instant. */
function rerender(){
  applyStatic();
  renderNav();
  renderLanguage();
  fillProduct();
  renderAnalysis();
  renderStrategy();
  renderAssets();
  renderSeeds();
  renderCommunities();
  renderDetail();
  renderQueue();
  renderChannels();
  renderHistory();
  renderManual();
}

/* ---------- Language ---------- */
function renderLanguage(){
  const sel = $('langSel');
  sel.innerHTML = Object.entries(STATE.languages || {en:'English'}).map(([code, label]) =>
    `<option value="${esc(code)}"${code===LANG?' selected':''}>${esc(label)}</option>`).join('');
  sel.onchange = async () => {
    LANG = sel.value;
    rerender();                                   // instant, from memory
    await api('/api/language/set', {language: LANG});   // remembered for next start
    $('langMsg').textContent = t('status.saved');
    setTimeout(()=>$('langMsg').textContent='', 1800);
  };
}

/* ---------- The whole chain ---------- */
async function runEverything(){
  const res = await api('/api/run/all', {use_api: $('runUseApi') && $('runUseApi').checked});
  if (res.error) { $('scanMsg').textContent = res.error; return; }
  $('runReport').hidden = true;
  $('scanBarWrap').style.display = '';
  pollJob();
}
$('runAllBtn').onclick = runEverything;
$('runAllBtn2').onclick = runEverything;

/* What the run did, and what it left out. Both halves matter: a stage that was
   skipped is the one the user has to do something about. */
function renderRunReport(report){
  if (!report || (!(report.done||[]).length && !(report.skipped||[]).length)) return;
  const line = (m) => `<div class="evidence">${esc(tr(m))}</div>`;
  $('runDone').innerHTML = (report.done||[]).map(line).join('')
    || `<p class="muted">&mdash;</p>`;
  $('runSkipped').innerHTML = (report.skipped||[]).map(line).join('')
    || `<p class="muted">&mdash;</p>`;
  $('runReport').hidden = false;
}

/* ---------- Job progress ---------- */
$('scanBtn').onclick = async () => {
  const res = await api('/api/scan/start',
    {platforms:['reddit','lemmy','forum','hackernews','lobsters']});
  if (res.error) { $('scanMsg').textContent = res.error; return; }
  $('scanBarWrap').style.display = '';
  pollJob();
};

async function pollJob(){
  const s = await api('/api/job/status');
  $('scanMsg').textContent = s.error ? tr(s.error) : tr(s.message);
  $('scanBtn').disabled = s.running;
  $('anaBtn').disabled = s.running;
  $('runAllBtn').disabled = s.running;
  if ($('runAllBtn2')) $('runAllBtn2').disabled = s.running;
  if (!s.running && s.kind === 'run') renderRunReport(s.report);
  const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
  $('scanBar').style.width = pct + '%';
  if (s.running) { $('scanBarWrap').style.display=''; setTimeout(pollJob, 1200); }
  else { $('scanBarWrap').style.display='none'; refresh(); }
}

/* ---------- Product ---------- */
function options(map, selected){
  return Object.entries(map||{}).map(([key, i18nKey]) =>
    `<option value="${esc(key)}"${key===selected?' selected':''}>${esc(t(i18nKey))}</option>`
  ).join('');
}

function renderProductSwitcher(){
  const sel = $('productSel');
  sel.title = t('product.switcher');
  sel.innerHTML = (STATE.products||[]).map(p =>
    `<option value="${esc(p.slug)}"${p.slug===STATE.active_product?' selected':''}>${esc(p.name)}</option>`
  ).join('') || `<option value="">${esc(t('product.none'))}</option>`;
  sel.onchange = async () => {
    if (!sel.value) return;
    await api('/api/product/select', {slug: sel.value});
    SELECTED = null; DRAFT = null;
    await refresh();
  };
}

function fillProduct(){
  const p = STATE.product || {};
  $('pCategory').innerHTML = options(STATE.categories, p.category);
  $('pPriceModel').innerHTML = options(STATE.price_models, p.price_model);
  $('pTone').innerHTML = options(STATE.tones, p.tone);
  $('pName').value = p.name || '';
  $('pUrl').value = p.url || '';
  $('pVersion').value = p.version || '';
  $('pOneLiner').value = p.one_liner || '';
  $('pPricePoint').value = p.price_point || '';
  $('pAudience').value = p.audience || '';
  $('pRegions').value = (p.regions||[]).join(', ');
  $('pLanguages').value = (p.languages||[]).join(', ');
  $('pBudget').value = p.budget_monthly_eur || 0;
  $('pRepo').value = (p.links||{}).repo || '';
  $('pDownload').value = (p.links||{}).download || '';
  $('pDescription').value = p.description || '';
  $('pKeywords').value = (p.keywords||[]).join(', ');
  $('pDelete').disabled = !STATE.active_product;
}

function collectProduct(){
  return {
    slug: STATE.active_product,
    name: $('pName').value, url: $('pUrl').value, version: $('pVersion').value,
    one_liner: $('pOneLiner').value, description: $('pDescription').value,
    category: $('pCategory').value, price_model: $('pPriceModel').value,
    price_point: $('pPricePoint').value, audience: $('pAudience').value,
    regions: $('pRegions').value, languages: $('pLanguages').value,
    budget_monthly_eur: $('pBudget').value, tone: $('pTone').value,
    keywords: $('pKeywords').value,
    links: {repo: $('pRepo').value, download: $('pDownload').value},
  };
}

$('pSave').onclick = async () => {
  if (!$('pName').value.trim()) { $('pMsg').textContent = t('product.needs_name'); return; }
  const res = await api('/api/product/save', {product: collectProduct()});
  if (res.error) { $('pMsg').textContent = res.error; return; }
  await api('/api/product/select', {slug: res.product.slug});
  await refresh();
  $('pMsg').textContent = t('status.saved');
  setTimeout(()=>$('pMsg').textContent='', 2000);
};

$('pNew').onclick = async () => {
  const name = prompt(t('product.new_prompt'));
  if (!name) return;
  const res = await api('/api/product/save', {product: {name}});
  await api('/api/product/select', {slug: res.product.slug});
  SELECTED = null; DRAFT = null;
  await refresh();
  $('pMsg').textContent = t('product.created');
};

$('pDelete').onclick = async () => {
  if (!confirm(t('product.delete_confirm', {name: (STATE.product||{}).name || ''}))) return;
  await api('/api/product/delete', {slug: STATE.active_product});
  SELECTED = null; DRAFT = null;
  await refresh();
};

/* ---------- Analysis ---------- */
$('anaBtn').onclick = async () => {
  const res = await api('/api/analysis/run', {use_api: $('anaApi').checked});
  if (res.error) { $('anaMsg').textContent = res.error; return; }
  $('anaMsg').textContent = t('status.running');
  $('scanBarWrap').style.display = '';
  pollJob();
};

function listPanel(titleKey, items, mapper){
  if (!items || !items.length) return '';
  return `<div class="panel"><h3>${esc(t(titleKey))}</h3><ul class="checklist">`
    + items.map(mapper).join('') + '</ul></div>';
}

function renderAnalysis(){
  const a = STATE.analysis || {};
  if (!a.generated_at){
    $('anaBox').innerHTML = `<div class="panel muted">${esc(t('analysis.empty'))}</div>`;
    return;
  }
  const site = a.site || {};
  const cat = a.category_guess || {}, price = a.price_guess || {};
  const evidence = (g, emptyKey) => (g.reasons||[]).map(r =>
    `<div class="evidence">${esc(r.quote)}</div>`).join('')
    || `<p class="muted">${esc(t(g.note_key || emptyKey))}</p>`;

  $('anaBox').innerHTML = `
    ${trAll(a.warnings).map(w => `<div class="warn">${esc(w)}</div>`).join('')}
    <div class="panel">
      <h3>${esc(t('analysis.page'))}</h3>
      <div class="kv">
        <div>${esc(t('analysis.fetched'))}</div>
        <div>${site.reachable ? esc(t('analysis.yes_http', {status: site.status}))
              : '<b>&mdash;</b> ' + esc(tr(site.error))}</div>
        <div>${esc(t('analysis.title_tag'))}</div><div>${esc(site.title||'-')}</div>
        <div>${esc(t('analysis.meta'))}</div><div>${esc(site.description||'-')}</div>
        <div>${esc(t('analysis.extent'))}</div>
        <div>${esc(t('analysis.words', {count: site.word_count||0}))}</div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>${esc(t('analysis.category_guess', {value: t(STATE.categories[cat.key] || 'category.other')}))}</h3>
        <p class="muted">${esc(t('analysis.confidence', {
            percent: Math.round((cat.confidence||0)*100),
            profile: t(STATE.categories[(STATE.product||{}).category] || 'category.other')}))}</p>
        ${evidence(cat, 'analysis.no_evidence')}
      </div>
      <div class="panel">
        <h3>${esc(t('analysis.price_guess', {value: t(STATE.price_models[price.key] || 'price.free')}))}</h3>
        <p class="muted">${esc(t('analysis.confidence', {
            percent: Math.round((price.confidence||0)*100),
            profile: t(STATE.price_models[(STATE.product||{}).price_model] || 'price.free')}))}</p>
        ${evidence(price, 'analysis.no_evidence')}
      </div>
    </div>
    <div class="panel">
      <h3>${esc(t('analysis.positioning'))}</h3>
      <p>${esc(a.positioning || t('analysis.positioning_empty'))}</p>
      ${a.tone_hint ? `<p class="muted">${esc(t('analysis.tone_hint', {value: a.tone_hint}))}</p>` : ''}
    </div>
    ${listPanel('analysis.value_props', a.value_props, v => `<li>${esc(v)}</li>`)}
    ${listPanel('analysis.segments', a.audience_segments, s =>
      `<li><b>${esc(s.name)}</b>${s.why?' &mdash; '+esc(s.why):''}
       ${s.where?`<div class="muted">${esc(t('analysis.segment_where',{value:s.where}))}</div>`:''}</li>`)}
    ${listPanel('analysis.objections', a.objections, o => `<li>${esc(o)}</li>`)}
    <div class="panel">
      <h3>${esc(t('analysis.keywords'))}</h3>
      <div>${(a.search_terms||[]).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <p class="muted" style="margin-top:12px">${esc(t('analysis.keywords_statistical'))}</p>
      <div>${(a.keywords||[]).slice(0,30).map(k =>
        `<span class="tag" title="${k.score}">${esc(k.term)}</span>`).join('')}</div>
    </div>`;
}

/* ---------- Strategy ---------- */
$('strBtn').onclick = async () => {
  $('strMsg').textContent = t('status.running');
  const res = await api('/api/strategy/build', {use_api: $('strApi').checked});
  if (res.error) { $('strMsg').textContent = res.error; return; }
  await refresh();
  openTab('strategy');
  $('strMsg').textContent = '';
};

function channelCard(c){
  const cls = c.kind === 'bezahlt' ? 'gelb' : (c.kind === 'eigen' ? 'gruen' : 'grau');
  return `<div class="panel">
    <h3>${esc(t(c.name_key))}
      <span class="badge ${cls}">${esc(t(c.kind_key))}</span>
      <span class="score" style="float:right">${Math.round((c.score||0)*100)}</span></h3>
    <p style="font-size:14px">${esc(t(c.what_key))}</p>
    <ul class="checklist">${trAll(c.why).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
    <div style="margin:10px 0">
      <span class="tag">${esc(t(c.effort_key))}</span>
      <span class="tag">${esc(t('strategy.effect', {value: t(c.lead_time_key)}))}</span>
      <span class="tag">${esc(t(c.automation_key))}</span>
      ${c.budget_eur ? `<span class="tag lila">${c.budget_eur} ${esc(t('common.eur_month'))}</span>` : ''}
    </div>
    <div class="kv" style="grid-template-columns:140px 1fr">
      <div>${esc(t('strategy.first_step'))}</div><div>${esc(t(c.first_step_key))}</div>
      <div>${esc(t('strategy.risk'))}</div><div>${esc(t(c.risk_key))}</div>
    </div>
  </div>`;
}

function renderStrategy(){
  const p = STATE.strategy || {};
  if (!p.generated_at){
    $('strBox').innerHTML = `<div class="panel muted">${esc(t('strategy.empty'))}</div>`;
    return;
  }
  const byId = {}; (p.channels||[]).forEach(c => byId[c.id] = c);

  $('strBox').innerHTML = `
    ${trAll(p.warnings).map(w => `<div class="warn">${esc(w)}</div>`).join('')}
    <div class="panel"><h3>${esc(t('strategy.summary'))}</h3><p>${esc(tr(p.summary))}</p></div>
    ${listPanel('strategy.first_week', trAll(p.first_week), x => `<li>${esc(x)}</li>`)}
    ${listPanel('strategy.watch_out', trAll(p.watch_out), x => `<li>${esc(x)}</li>`)}
    ${(p.budget_plan||[]).length ? `<div class="panel">
      <h3>${esc(t('strategy.budget', {amount: p.budget_monthly_eur}))}</h3>
      <table><thead><tr><th>${esc(t('strategy.col_channel'))}</th>
        <th>${esc(t('strategy.col_month'))}</th><th>${esc(t('strategy.col_share'))}</th>
        <th></th></tr></thead><tbody>
      ${p.budget_plan.map(b => `<tr><td>${esc(t(b.name_key))}</td><td>${b.eur} EUR</td>
        <td>${Math.round((b.share||0)*100)}%</td>
        <td class="muted">${b.note_key ? esc(t(b.note_key)) : ''}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    ${(p.phases||[]).map(ph => `<div class="panel">
      <h3>${esc(t(ph.name_key))}</h3><p class="muted">${esc(t(ph.note_key))}</p>
      <div>${ph.channels.map(id =>
        `<span class="tag">${esc(t((byId[id]||{}).name_key || id))}</span>`).join('')}</div>
    </div>`).join('')}
    <h3 style="margin:28px 0 0">${esc(t('strategy.channels_detail'))}</h3>
    ${(p.channels||[]).map(channelCard).join('')}
    ${(p.rejected||[]).length ? `<div class="panel">
      <h3>${esc(t('strategy.rejected'))}</h3>
      <p class="muted">${esc(t('strategy.rejected_intro'))}</p>
      ${p.rejected.map(r => `<div class="evidence"><b>${esc(t(r.name_key))}</b><br>
        ${esc(tr(r.blocked))}</div>`).join('')}
    </div>` : ''}`;
}

/* ---------- Assets ---------- */
function assetField(asset, spec){
  const entries = (asset.fields||{})[spec.key] || [];
  if (!entries.length){
    return `<div style="margin:14px 0"><b>${esc(t(spec.label_key))}</b>
      <div class="muted">${esc(t('assets.nothing'))}</div></div>`;
  }
  const rows = entries.map((e,i) => {
    const over = e.length > spec.limit;
    const colour = over ? 'var(--red)' : (e.truncated ? 'var(--yellow)' : 'var(--muted-2)');
    return `<tr>
      <td style="width:66px;color:${colour};font-variant-numeric:tabular-nums">${e.length}/${spec.limit}</td>
      <td><span style="white-space:pre-wrap">${esc(e.text)}</span>
        ${e.truncated ? `<span class="tag">${esc(t('assets.truncated'))}</span>` : ''}
        ${over ? `<span class="badge rot">${esc(t('assets.too_long'))}</span>` : ''}</td>
      <td style="width:96px"><button class="btn ghost" data-acopy="${esc(asset.asset_id)}"
        data-afield="${esc(spec.key)}" data-ai="${i}">${esc(t('action.copy'))}</button></td>
    </tr>`;
  }).join('');
  return `<div style="margin:18px 0">
    <b>${esc(t(spec.label_key))}</b>
    <span class="muted">&mdash; ${esc(t('assets.limit_hint',{limit:spec.limit}))}
      ${esc(t(spec.hint_key))}</span>
    <table style="margin-top:6px"><tbody>${rows}</tbody></table></div>`;
}

function renderAssets(){
  const specs = STATE.asset_specs || [];
  const made = STATE.assets || {};
  const recommended = {};
  ((STATE.strategy||{}).channels||[]).forEach(c => recommended[c.id] = c);

  if (!specs.length){
    $('assetBox').innerHTML = `<div class="panel muted">${esc(t('common.no_product'))}</div>`;
    return;
  }
  const sorted = specs.slice().sort((a,b) =>
    (recommended[b.channel] ? (recommended[b.channel].score||0) : -1) -
    (recommended[a.channel] ? (recommended[a.channel].score||0) : -1));

  $('assetBox').innerHTML = sorted.map(spec => {
    const a = made[spec.id];
    const known = !!recommended[spec.channel];
    return `<div class="panel">
      <h3>${esc(t(spec.name_key))}
        <span class="badge ${known?'gruen':'grau'}">${esc(t(known
          ? 'assets.channel_recommended' : 'assets.channel_not_planned'))}</span></h3>
      <p style="font-size:14px">${esc(t(spec.what_key))}</p>
      ${spec.note_key ? `<div class="warn">${esc(t(spec.note_key))}</div>` : ''}
      <div class="row">
        <button class="btn" data-abuild="${esc(spec.id)}">${esc(t(a
          ? 'assets.rebuild' : 'assets.build'))}</button>
        ${a ? `<span class="muted">${esc(t('assets.generated', {
            source: t('assets.source.' + a.generated_by),
            date: new Date(a.generated_at*1000).toLocaleString()}))}</span>` : ''}
      </div>
      ${a ? `
        ${trAll(a.warnings).map(w=>`<div class="warn">${esc(w)}</div>`).join('')}

        ${(a.negative_keywords||[]).length ? `<div style="margin-top:10px">
          <b>${esc(t('assets.negative_keywords'))}</b>
          <div class="muted">${esc(t('assets.negative_intro'))}</div>
          <div style="margin-top:6px">${a.negative_keywords.map(k=>

          </div></div>` : ''}` : ''}
    </div>`;
  }).join('');

  document.querySelectorAll('[data-abuild]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    $('assetMsg').textContent = t('status.running');
    const res = await api('/api/asset/build', {asset_id: b.dataset.abuild,
                                               use_api: $('assetApi').checked});
    if (res.error) { $('assetMsg').textContent = res.error; b.disabled = false; return; }
    await refresh(); openTab('assets');
    $('assetMsg').textContent = '';
  });
  document.querySelectorAll('[data-acopy]').forEach(b => b.onclick = () => {
    const a = (STATE.assets||{})[b.dataset.acopy];
    const item = ((a.fields||{})[b.dataset.afield]||[])[+b.dataset.ai];
    if (!item) return;
    navigator.clipboard.writeText(item.text);
    b.textContent = t('action.copied');
    setTimeout(()=>b.textContent=t('action.copy'), 1500);
  });
  document.querySelectorAll('[data-autm]').forEach(b => b.onclick = () => {
    const a = (STATE.assets||{})[b.dataset.autm];
    if (!a) return;
    navigator.clipboard.writeText(a.utm_url);
    b.textContent = t('action.copied');
    setTimeout(()=>b.textContent=t('action.copy'), 1500);
  });
}

/* ---------- Seed lists ---------- */
function renderSeeds(){
  const sd = STATE.seeds || {subreddits:[], forums:[]};
  $('seedSubs').value = (sd.subreddits||[]).join('\n');
  $('seedForums').value = (sd.forums||[]).map(f =>
    [f.url, f.name||'', f.note||''].join(' | ').replace(/( \| )+$/,'')).join('\n');
  $('seedLemmy').value = (sd.lemmy_instances||[]).join('\n');
  $('seedKeywords').innerHTML = (STATE.keywords||[]).length
    ? STATE.keywords.map(k => `<span class="tag">${esc(k)}</span>`).join('')
    : `<p class="muted">${esc(t('seeds.keywords_empty'))}</p>`;
}

function parseSeeds(){
  return {
    subreddits: $('seedSubs').value.split('\n').map(x=>x.trim()).filter(Boolean),
    forums: $('seedForums').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line => {
      const bits = line.split('|').map(x=>x.trim());
      return {url: bits[0], name: bits[1]||'', note: bits[2]||''};
    }),
    lemmy_instances: $('seedLemmy').value.split('\n').map(x=>x.trim()).filter(Boolean),
    source: 'manual',
  };
}

$('seedSave').onclick = async () => {
  const res = await api('/api/seeds/save', {seeds: parseSeeds()});
  if (res.error) { $('seedMsg').textContent = res.error; return; }
  await refresh(); openTab('seeds');
  $('seedMsg').textContent = t('status.saved');
  setTimeout(()=>$('seedMsg').textContent='', 2000);
};

$('seedSuggest').onclick = async () => {
  if (!STATE.has_api_key){ $('seedMsg').textContent = t('seeds.needs_key'); return; }
  await api('/api/seeds/save', {seeds: parseSeeds()});
  const res = await api('/api/seeds/suggest', {});
  if (res.error) { $('seedMsg').textContent = res.error; return; }
  $('seedMsg').textContent = t('status.running');
  $('scanBarWrap').style.display = '';
  pollJob();
};

/* ---------- Communities ---------- */
function filtered(){
  const q = $('filterText').value.toLowerCase();

  return (STATE.communities||[]).filter(c =>
    (!pf || c.platform === pf) &&
    (!v || (c.analysis||{}).verdict === v) &&

  const list = filtered();

const current = () => (STATE.communities||[]).find(c => c.id === SELECTED);

function renderDetail(){
  const c = current();
  if (!c) { $('detail').innerHTML = `<div class="panel muted">${esc(t('common.no_selection'))}</div>`; return; }
  const a = c.analysis || {}, v = a.verdict || 'grau';
  const evidence = (a.evidence||[]).map(e =>
    `<div class="evidence"><b>${esc(t(e.label))}</b> &mdash; ${esc(e.source)}<br>${esc(e.quote)}</div>`)
    .join('') || `<p class="muted">${esc(t('communities.no_evidence'))}</p>`;
  // The category that lifted a ban to a condition is the whole point of the
  // amber verdict here - naming it without linking it would leave the user to
  // hunt for it on the forum.
  // Hacker News publishes no member count, so the record replaces it: what this
  // topic actually did there over the last year. Numbers, with the stories behind
  // them - the user draws the conclusion.
  const tr = c.topic_record;
  const record = tr ? `<div class="evidence"><b>${esc(t('communities.hn_record',
      {stories: tr.stories, days: tr.window_days, points: tr.median_points}))}</b>
      ${(tr.examples||[]).slice(0,3).map(x =>
        `<br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.points)} &middot; ${esc(x.title)}</a>`
      ).join('')}</div>` : '';
  const tags = (c.matching_tags||[]).length
    ? `<div class="evidence"><b>${esc(t('communities.lobsters_tags'))}</b><br>${
        c.matching_tags.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`
    : '';
  const sc = c.showcase_category;
  const showcase = sc ? `<div class="evidence"><b>${esc(t('communities.showcase'))}</b><br>
      <a href="${esc(sc.url)}" target="_blank" rel="noopener">${esc(sc.name)}</a>
      &mdash; ${esc(t('communities.showcase_only'))}</div>` : '';
  const angleOpts = Object.entries(STATE.angles||{}).map(([k, key]) =>
    `<option value="${esc(k)}">${esc(t(key))}</option>`).join('');

  $('detail').innerHTML = `
    <div class="panel">
      <h3>${esc(c.name)} <span class="badge ${v}">${esc(t('verdict.'+v))}</span></h3>
      <div class="muted">${esc(c.title||'')}</div>
      <p style="font-size:14px">${esc((c.description||'').slice(0,400))}</p>
      <div>${(a.labels||[]).map(l => `<span class="tag">${esc(t(l))}</span>`).join('')}</div>
      <p><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></p>
      ${showcase}
      ${record}
      ${tags}
      ${v==='rot' ? `<div class="warn">${t('communities.do_not_post')}</div>` : ''}
      <h3 style="margin-top:18px">${esc(t('communities.evidence'))}</h3>
      ${evidence}
    </div>
    <div class="panel">
      <h3>${esc(t('communities.draft'))}</h3>
      <div class="row">
        <select id="angleSel">${angleOpts}</select>
        <label class="check"><input type="checkbox" id="useApi"> <span>${esc(t('assets.use_api'))}</span></label>
        <button class="btn ghost" id="genBtn">${esc(t('communities.generate'))}</button>
        <button class="btn ghost" id="varBtn">${esc(t('communities.variant'))}</button>
      </div>
      <div id="draftBox"></div>
    </div>`;

  $('genBtn').onclick = () => generate(false);
  $('varBtn').onclick = () => generate(true);
  if (DRAFT && DRAFT.community_id === c.id) renderDraft(); else generate(false);
}

async function generate(variant){
  const c = current(); if (!c) return;
  $('draftBox').innerHTML = `<p class="muted">${esc(t('status.running'))}</p>`;
  DRAFT = await api('/api/draft', {community_id: c.id, angle: $('angleSel').value,
    use_api: $('useApi').checked, seed: variant ? Math.floor(Math.random()*99999) : null});
  renderDraft();
}

function renderDraft(){
  const c = current(); if (!c || !DRAFT) return;
  $('draftBox').innerHTML = `
    ${DRAFT.warning ? `<div class="warn">${esc(tr(DRAFT.warning))}</div>` : ''}
    <p class="muted">${esc(t('communities.angle', {angle: t(DRAFT.angle_label)}))}
      &middot; ${esc(t('communities.via', {source: t('assets.source.'+DRAFT.generated_by)}))}</p>
    <input id="dTitle" style="width:100%;margin-bottom:8px" value="${esc(DRAFT.title)}">
    <textarea id="dBody">${esc(DRAFT.body)}</textarea>
    <h3 style="margin-top:16px">${esc(t('communities.checklist'))}</h3>
    <ul class="checklist">${(DRAFT.requirements||[]).map(r=>`<li>${esc(t(r))}</li>`).join('')}</ul>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="copyBtn">${esc(t('action.copy'))}</button>
      <button class="btn ghost" id="queueBtn">${esc(t('communities.to_queue'))}</button>
      <button class="btn" id="openBtn">${esc(t('communities.open_form'))}</button>
      <button class="btn ghost" id="doneBtn">${esc(t('communities.mark_posted'))}</button>

  const sync = () => { DRAFT.title = $('dTitle').value; DRAFT.body = $('dBody').value; };
  $('dTitle').oninput = sync; $('dBody').oninput = sync;

  $('copyBtn').onclick = () => { sync();
    navigator.clipboard.writeText(DRAFT.title + '\n\n' + DRAFT.body);
    $('copyBtn').textContent = t('action.copied');
    setTimeout(()=>$('copyBtn').textContent=t('action.copy'),1500); };

  $('queueBtn').onclick = async () => { sync();
    await api('/api/queue/add', {draft: DRAFT}); await refresh(); openTab('communities');
    $('guardBox').innerHTML = `<div class="ok">${esc(t('communities.queued'))}</div>`; };

  $('openBtn').onclick = async () => { sync();
    const res = await api('/api/assist', {community_id: c.id, draft: DRAFT});
    if (!res.guard.allowed){
      $('guardBox').innerHTML = `<div class="warn">${t('communities.guard')}<ul class="checklist">
        ${trAll(res.guard.reasons).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
        <button class="btn ghost" id="forceBtn">${esc(t('communities.force'))}</button></div>`;
      $('forceBtn').onclick = () => window.open(res.url, '_blank', 'noopener');
      return;
    }
    $('guardBox').innerHTML = `<div class="ok">${esc(t('communities.form_opened'))}</div>`;
    window.open(res.url, '_blank', 'noopener'); };

  $('doneBtn').onclick = async () => { sync();
    await api('/api/log', {community_id: c.id, draft: DRAFT, channel: c.name, result: 'posted'});
    await refresh(); openTab('communities');
    $('guardBox').innerHTML = `<div class="ok">${esc(t('communities.logged'))}</div>`; };

$('runStart').onclick = () => { if ((STATE.queue||[]).length){ RUN = 0; renderRun(); } };
$('runExit').onclick = () => { RUN = -1; $('runPanel').hidden = true; };

function renderRun(){
  const queue = STATE.queue || [];
  if (RUN < 0 || RUN >= queue.length){
    $('runPanel').hidden = true;
    if (RUN >= 0) alert(t('campaign.finished'));
    RUN = -1; return;
  }
  const q = queue[RUN];
  $('runPanel').hidden = false;
  $('runHead').textContent = t('campaign.step',
    {current: RUN+1, total: queue.length, community: q.community});
  $('runBar').style.width = Math.round(100*RUN/queue.length) + '%';
  const today = new Date().toISOString().slice(0,10);
  const late = q.scheduled_for && q.scheduled_for > today;

  $('runBody').innerHTML = `
    <div class="row">
      <span class="badge ${q.verdict||'grau'}">${esc(t('verdict.short.'+(q.verdict||'grau')))}</span>
      <span class="tag">${esc(t(q.angle_label||'angle.resource'))}</span>
      <span class="tag">${esc(t('campaign.scheduled', {date: q.scheduled_for||'-'}))}</span>
    </div>
    ${late ? `<div class="warn">${esc(t('campaign.too_early'))}</div>` : ''}
    <h3 style="margin-top:16px">${esc(t('communities.checklist'))}</h3>
    <ul class="checklist">${(q.requirements||[]).map(r=>`<li>${esc(t(r))}</li>`).join('')}</ul>
    <input id="runTitle" style="width:100%;margin:10px 0 8px" value="${esc(q.title)}">
    <textarea id="runText">${esc(q.body)}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="runOpen">${esc(t('campaign.copy_open'))}</button>
      <button class="btn ghost" id="runDone">${esc(t('campaign.posted_next'))}</button>
      <button class="btn ghost" id="runSkip">${esc(t('campaign.skip'))}</button>
    </div>
    <p class="muted" id="runHint"></p>`;

  const sync = () => { q.title = $('runTitle').value; q.body = $('runText').value; };
  $('runTitle').oninput = sync; $('runText').oninput = sync;

  $('runOpen').onclick = async () => { sync();
    await navigator.clipboard.writeText(q.title + '\n\n' + q.body).catch(()=>{});
    const res = await api('/api/assist', {community_id: q.community_id, draft: q});
    window.open(res.url || q.target_url, '_blank', 'noopener');
    $('runHint').textContent = res.guard.allowed ? t('campaign.clipboard')
      : t('campaign.note', {reasons: trAll(res.guard.reasons).join(' ')}); };

  $('runDone').onclick = async () => { sync();
    await api('/api/log', {community_id: q.community_id, draft: q,
      channel: q.community, result: 'posted'});
    await refresh(); openTab('campaign'); renderRun(); };

  $('runSkip').onclick = () => { RUN++; renderRun(); };
}

  $('cfgMinDays').value = c.safety.min_days_between_same_subreddit;
  $('cfgApiKey').value = (c.anthropic||{}).api_key || '';
  $('cfgModel').value = (c.anthropic||{}).model || '';
  $('cfgRedditId').value = (c.reddit||{}).client_id || '';
  $('cfgRedditSecret').value = (c.reddit||{}).client_secret || '';
  $('cfgBotUser').value = (c.reddit||{}).bot_username || '';
  $('cfgBotPass').value = (c.reddit||{}).bot_password || '';
}

const redditCfg = () => ({client_id:$('cfgRedditId').value.trim(),
  client_secret:$('cfgRedditSecret').value.trim(),
  bot_username:$('cfgBotUser').value.trim(), bot_password:$('cfgBotPass').value});

$('testReddit').onclick = async () => {
  $('redditMsg').textContent = t('status.running');
  await api('/api/config', {config:{reddit: redditCfg()}});
  const res = await api('/api/reddit/check', {});
  $('redditMsg').textContent = res.detail;
  $('redditMsg').style.color = res.ok ? 'var(--green)' : '#ff8b92';
};

$('testLemmy').onclick = async () => {
  $('lemmyMsg').textContent = t('status.running');
  const instance = $('cfgLemmyInstance').value.trim() || 'lemmy.world';
  const res = await api('/api/lemmy/check', {instance});
  $('lemmyMsg').textContent = res.ok
    ? t('settings.lemmy_ok', {title: res.title, api: res.api, users: res.users})
    : t('settings.lemmy_fail', {instance: res.instance || instance});
  $('lemmyMsg').style.color = res.ok ? 'var(--green)' : '#ff8b92';
};

$('saveCfg').onclick = async () => {
  await api('/api/config', {config:{
    discovery:{max_communities:+$('cfgMax').value, deep_scan_top_n:+$('cfgDeep').value,
      min_subscribers:+$('cfgMinSubs').value},
    request_delay_seconds: +$('cfgDelay').value,
    safety:{max_reddit_posts_per_day:+$('cfgMaxDay').value,
            min_days_between_same_subreddit:+$('cfgMinDays').value},
    anthropic:{api_key:$('cfgApiKey').value, model:$('cfgModel').value},
    reddit: redditCfg()}});
  $('cfgMsg').textContent = t('status.saved');
  setTimeout(()=>$('cfgMsg').textContent='', 2000);
  await refresh(); openTab('settings');
};

refresh();
pollJob();
</script>
</body>
</html>
