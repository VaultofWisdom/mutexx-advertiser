  $('acctPass').onkeydown = (e) => { if (e.key === 'Enter') $('acctGo').click(); };
  $('acctGo').onclick = async () => {
    const body = {email: $('acctEmail').value.trim(), password: $('acctPass').value};
    if (up) body.display_name = $('acctName').value.trim();
    $('acctGo').disabled = true;
    const res = await api(up ? '/api/account/signup' : '/api/account/signin', body);
    $('acctGo').disabled = false;
    if (res.error){ toast(res.error, 'err'); return; }
    if (res.account && res.account.pending_confirmation){
      toast(t('account.check_inbox', {email: res.account.pending_confirmation}), 'info');
      ACCOUNT_MODE = 'signin'; renderAccount(); return;
    }
    STATE = res.state; render();
    toast(t('account.welcome'));
    const sync = await api('/api/account/sync', {});
    await refresh();
    if (sync.result) toast(syncLine(sync.result), sync.result.status === 'ok' ? 'ok' : 'warn');
  };
}

/* =====================================================================
   Settings
   ===================================================================== */
const SETTINGS_FIELDS = ['cfgApiKey','cfgModel','cfgRedditId','cfgRedditSecret','cfgBotUser','cfgBotPass',
  'cfgMax','cfgDeep','cfgMinSubs','cfgDelay','cfgMaxDay','cfgMinDays'];
SETTINGS_FIELDS.forEach(id => $(id).addEventListener('input', () => { SETTINGS_DIRTY = true; $('cfgDirty').hidden = false; }));

const SECRET_FIELDS = {cfgApiKey:'anthropic.api_key', cfgRedditSecret:'reddit.client_secret',
                       cfgBotPass:'reddit.bot_password'};

function secretLine(path){
  return `<span class="secret-state">${ic('check','sm')}${esc(t('settings.secret_stored'))}</span>
    · <a href="#" data-clear="${esc(path)}">${esc(t('settings.secret_remove'))}</a>`;
}
function bindSecretRemove(){
  document.querySelectorAll('[data-clear]').forEach(a => a.onclick = async (e) => {
    e.preventDefault();
    if (!(await ask({title: t('settings.secret_remove_title'), body: a.dataset.clear,
                     confirm: t('settings.secret_remove'), danger: true}))) return;
    await api('/api/config', {config: {clear_secrets: [a.dataset.clear]}});
    await refresh();
    toast(t('settings.secret_removed'));
  });
}

function fillSettings(){
  const c = STATE.config || {}; if (!c.discovery) return;
  $('dataDir').textContent = STATE.data_dir || '';
  for (const [id, path] of Object.entries(SECRET_FIELDS)){
    const stored = secretState(path);
    $(id).placeholder = stored ? '••••••••••••' : (id === 'cfgApiKey' ? 'sk-ant-...' : '');
    $(id + 'State').innerHTML = stored ? secretLine(path) : '';
  }
  bindSecretRemove();
  $('cfgDirty').hidden = !SETTINGS_DIRTY;
  if (SETTINGS_DIRTY) return;
  Object.keys(SECRET_FIELDS).forEach(id => $(id).value = '');
  $('cfgMax').value = c.discovery.max_communities;
  $('cfgDeep').value = c.discovery.deep_scan_top_n;
  $('cfgMinSubs').value = c.discovery.min_subscribers;
  $('cfgDelay').value = c.request_delay_seconds;
  $('cfgMaxDay').value = c.safety.max_reddit_posts_per_day;
  $('cfgMinDays').value = c.safety.min_days_between_same_subreddit;
  $('cfgModel').value = (c.anthropic||{}).model || '';
  $('cfgRedditId').value = (c.reddit||{}).client_id || '';
  $('cfgBotUser').value = (c.reddit||{}).bot_username || '';
}

const redditCfg = () => ({client_id: $('cfgRedditId').value.trim(),
  client_secret: $('cfgRedditSecret').value.trim(),
  bot_username: $('cfgBotUser').value.trim(), bot_password: $('cfgBotPass').value});

$('testReddit').onclick = async () => {
  $('redditMsg').innerHTML = `<div class="row muted small" style="margin-top:12px"><div class="spin"></div>${esc(t('status.running'))}</div>`;
  await api('/api/config', {config:{reddit: redditCfg()}});
  const res = await api('/api/reddit/check', {});
  $('redditMsg').innerHTML = note(res.ok ? 'ok' : 'bad', esc(tr(res.detail) || res.error || ''));
};

$('testLemmy').onclick = async () => {
  $('lemmyMsg').innerHTML = `<div class="row muted small" style="margin-top:12px"><div class="spin"></div>${esc(t('status.running'))}</div>`;
  const instance = $('cfgLemmyInstance').value.trim() || 'lemmy.world';
  const res = await api('/api/lemmy/check', {instance});
  $('lemmyMsg').innerHTML = note(res.ok ? 'ok' : 'bad', esc(res.ok
    ? t('settings.lemmy_ok', {title: res.title, api: res.api, users: fmtNum(res.users)})
    : t('settings.lemmy_fail', {instance: res.instance || instance})));
};

$('saveCfg').onclick = async () => {
  const num = (id, fallback) => { const v = parseFloat($(id).value); return isNaN(v) ? fallback : v; };
  const c = STATE.config || {};
  const res = await api('/api/config', {config:{
    discovery:{max_communities: num('cfgMax', c.discovery.max_communities),
      deep_scan_top_n: num('cfgDeep', c.discovery.deep_scan_top_n),
      min_subscribers: num('cfgMinSubs', c.discovery.min_subscribers)},
    request_delay_seconds: Math.max(0.5, num('cfgDelay', c.request_delay_seconds)),
    safety:{max_reddit_posts_per_day: Math.max(1, num('cfgMaxDay', c.safety.max_reddit_posts_per_day)),
            min_days_between_same_subreddit: Math.max(0, num('cfgMinDays', c.safety.min_days_between_same_subreddit))},
    anthropic:{api_key: $('cfgApiKey').value.trim(), model: $('cfgModel').value.trim()},
    reddit: redditCfg()}});
  if (res.error){ toast(res.error, 'err'); return; }
  SETTINGS_DIRTY = false;
  await refresh();
  toast(t('settings.saved'));
};

window.addEventListener('beforeunload', (e) => {
  if (PRODUCT_DIRTY || SETTINGS_DIRTY){ e.preventDefault(); e.returnValue = ''; }
});

/* =====================================================================
   Start
   ===================================================================== */
TAB = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
refresh().then(pollJob);
// The account syncs on its own every few minutes. Pick up what it brought in -
// but never while the user is typing in a form that a re-render would reset.
setInterval(async () => {
  if (!(STATE.account||{}).signed_in || JOB.running || PRODUCT_DIRTY || SETTINGS_DIRTY) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!$('focus').hidden || $('dlg').open) return;
  const before = JSON.stringify((STATE.account||{}).last || null);
  const fresh = await api('/api/state');
  if (JSON.stringify((fresh.account||{}).last || null) !== before){
    STATE = fresh; LANG = STATE.ui_language || LANG; render();
  }
}, 60000);
</script>
</body>
